spring:
  data:
    mongodb:
      password: ayoub
      username: root
      host: localhost
      database: customer
      authentication-database: admin
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: payment-group,order-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringSerializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        spring.json.trusted.packages: '*'
        spring.json.type.mapping: orderConfirmation:com.ayoub.ecommerce.kafka.OrderConfirmation,paymentConfirmation:com.ayoub.ecommerce.notification.NotificationPaymentRequest
  mail:
    host: localhost
    port: 1025
    username: ayoub
    password: ayoub
    properties:
      mail:
        smtp:
          trust: "*"
        auth: true
        starttls:
          enable: true
        connectiontimeout: 5000
        timeout: 3000
        writetimeout: 5000
server:
  port: 8040
